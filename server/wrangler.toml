# Hoop Shoot API — Cloudflare Workers + D1 (docs/BACKEND.md).
# Top level = local dev + the Vitest pool. `wrangler deploy --env production`
# ships the real thing; its D1 id is filled in after `wrangler d1 create`.
name = "hoop-shoot-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
FEATURE_SUBMIT = "on"
FEATURE_BOARD = "on"
FEATURE_TRANSFER = "on"
FEATURE_SAVE = "on"
FEATURE_MATCH = "on"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom", "Lobby"]

[[d1_databases]]
binding = "DB"
database_name = "hoop_shoot"
database_id = "local"
migrations_dir = "migrations"

[env.production]
name = "hoop-shoot-api"

[env.production.vars]
FEATURE_SUBMIT = "on"
FEATURE_BOARD = "on"
FEATURE_TRANSFER = "on"
FEATURE_SAVE = "on"
FEATURE_MATCH = "on"

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

[[env.production.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[env.production.d1_databases]]
binding = "DB"
database_name = "hoop_shoot"
database_id = "33bd05b6-ab7f-49d6-b5f1-7e8115a5265e"
migrations_dir = "migrations"

# Token buckets at the edge (the Workers Rate Limiting binding: periods of
# 10 or 60 s only; longer windows live in the D1 `rl` table). RL_IP is the
# per-IP wall in front of everything — a workers.dev host has no WAF rules.
# Missing bindings (local dev, tests) fall back to an in-isolate window.
[[env.production.unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_SCORES"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_BOARD"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_ME"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_SAVE"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_MATCH"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 4 * * *"]
